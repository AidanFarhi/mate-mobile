name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test
    # These checks are pure Dart, so they do not need a macOS runner. The first
    # iOS build job belongs with release readiness (#24).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # .fvmrc is the single source of truth for the SDK version.
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - run: flutter pub get

      # Cheapest check first: fails in seconds on the easiest thing to fix.
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      # --fatal-infos is what makes the stricter lints in analysis_options.yaml
      # actually block a merge; without it they are advisory.
      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test
