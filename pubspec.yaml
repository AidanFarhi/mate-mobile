name: mate
description: "Mate - minimal chess with your friends."
publish_to: 'none'

# build-name maps to CFBundleShortVersionString, build-number to CFBundleVersion.
version: 1.0.0+1

# Keep in sync with .fvmrc, which pins the SDK for contributors and CI.
environment:
  sdk: ^3.13.1
  flutter: '>=3.47.1'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.2
  go_router: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Only the license texts are assets. The .ttf files are bundled by the `fonts`
  # section below; listing the directory here would ship them a second time.
  assets:
    - assets/fonts/InstrumentSans-OFL.txt
    - assets/fonts/JetBrainsMono-OFL.txt

  # Both faces are variable fonts, bundled under the SIL Open Font License (the
  # OFL.txt beside each). One file per family covers every weight the design
  # uses: styles set `fontVariations` to pick one -- `fontWeight` alone would
  # ask for a static instance these files do not contain.
  fonts:
    - family: Instrument Sans
      fonts:
        - asset: assets/fonts/InstrumentSans-Variable.ttf
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
